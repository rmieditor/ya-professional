<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная шапка (Scroll Video)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
            color: #fff;
        }

        /* 
         * УМЕНЬШИЛИ ВЫСОТУ: Теперь нужно прокрутить 250% экрана вместо 400%.
         * Чем меньше это значение, тем быстрее пролетит анимация.
         * Не ставьте меньше 150vh, иначе анимация будет слишком резкой.
         */
        .scroll-track {
            height: 200vh; 
            position: relative;
        }

        .sticky-viewport {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        #video-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 1000px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .overlay-text h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .overlay-text p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 300;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        #source-video {
            display: none;
        }

        .next-section {
            min-height: 100vh;
            padding: 100px 20px;
            background: #fff;
            color: #333;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .next-section h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="scroll-track">
        <div class="sticky-viewport">
            <canvas id="video-canvas"></canvas>
            
            <div class="overlay-text">
                <h1 id="main-title">Добро пожаловать</h1>
                <p id="sub-title">Прокрутите вниз, чтобы увидеть эффект</p>
            </div>
        </div>
    </div>

    <div class="next-section">
        <h2>Основной контент сайта</h2>
        <p>Шапка успешно развернулась. Теперь вы можете читать далее.</p>
    </div>

    <video id="source-video" 
           src="img/vid 1.mp4" 
           muted 
           playsinline>
    </video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const video = document.getElementById('source-video');
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');
        const title = document.getElementById('main-title');
        const subtitle = document.getElementById('sub-title');

        // Переменная для хранения времени предыдущего отрисованного кадра
        let lastTime = -1;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        video.addEventListener('loadeddata', () => {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            gsap.to(video, {
                currentTime: video.duration,
                ease: "none",
                scrollTrigger: {
                    trigger: ".scroll-track",
                    start: "top top",
                    end: "bottom bottom",
                    // ИЗМЕНЕНО: scrub: 1 делает прокрутку более плавной и "тягучей".
                    // Если хотите еще плавнее, поставьте 1.5 или 2.
                    scrub: 1, 
                    pin: true,
                    anticipatePin: 1,
                    onUpdate: (self) => {
                        const progress = self.progress;
                        
                        if (progress > 0.1 && progress < 0.4) {
                            title.innerText = "Ледокол";
                            subtitle.innerText = "Вид снаружи";
                            title.style.opacity = 1;
                            subtitle.style.opacity = 1;
                        } else if (progress >= 0.4 && progress < 0.8) {
                            title.innerText = "Смена ракурса";
                            subtitle.innerText = "Мы поднимаемся на борт...";
                            title.style.opacity = 0.8;
                            subtitle.style.opacity = 0.6;
                        } else if (progress >= 0.8) {
                            title.innerText = "На палубе";
                            subtitle.innerText = "Вид на льды";
                            title.style.opacity = 1;
                            subtitle.style.opacity = 1;
                        } else {
                            title.style.opacity = 0;
                            subtitle.style.opacity = 0;
                        }
                    }
                }
            });
                }
                requestAnimationFrame(render);
            }
            render();
        });

        video.addEventListener('error', () => {
            console.error("Ошибка загрузки видео. Проверьте путь 'img/vid 1.mp4'.");
            canvas.style.background = "linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbb2d)";
            title.innerText = "Видео не найдено";
            subtitle.innerText = "Проверьте путь к файлу";
        });
    </script>
</body>
</html>
