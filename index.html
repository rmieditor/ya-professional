<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная шапка (Scroll Video)</title>
    
    <!-- Подключаем внешний файл со стилями -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 1. Блок управления прокруткой -->
    <div class="scroll-track">
        <!-- 2. Визуальный блок, который фиксируется -->
        <div class="sticky-viewport">
            <canvas id="video-canvas"></canvas>
            
            <div class="overlay-text">
                <h1 id="main-title">Добро пожаловать</h1>
                <p id="sub-title">Прокрутите вниз, чтобы увидеть эффект</p>
            </div>
        </div>
    </div>

    <!-- 3. Следующий контент на сайте -->
    <div class="next-section">
        <h2>Основной контент сайта</h2>
        <p>Шапка успешно развернулась. Теперь вы можете читать далее.</p>
    </div>

    <!-- Скрытое видео (путь к вашему файлу) -->
    <video id="source-video" src="img/vid 1.mp4" muted playsinline></video>

    <!-- Подключаем библиотеки GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Логика работы анимации -->
    <script>
        gsap.registerPlugin(ScrollTrigger);

        const video = document.getElementById('source-video');
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');
        const title = document.getElementById('main-title');
        const subtitle = document.getElementById('sub-title');

        let lastTime = -1;

        // Функция изменения размера холста
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (video.readyState >= 2) {
                drawVideoFrame(); 
            }
        }

        // Функция отрисовки видео с сохранением пропорций (эффект object-fit: cover)
        function drawVideoFrame() {
            const hRatio = canvas.width / video.videoWidth;
            const vRatio = canvas.height / video.videoHeight;
            const ratio = Math.max(hRatio, vRatio);
            
            const centerShift_x = (canvas.width - video.videoWidth * ratio) / 2;
            const centerShift_y = (canvas.height - video.videoHeight * ratio) / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(
                video, 
                0, 0, video.videoWidth, video.videoHeight,
                centerShift_x, centerShift_y, video.videoWidth * ratio, video.videoHeight * ratio
            );
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        video.addEventListener('loadeddata', () => {
            drawVideoFrame();

            gsap.to(video, {
                currentTime: video.duration,
                ease: "none",
                scrollTrigger: {
                    trigger: ".scroll-track",
                    start: "top top",
                    end: "bottom bottom",
                    scrub: 1, // Плавность прокрутки
                    pin: ".sticky-viewport", // Фиксируем только экран
                    pinSpacing: true, 
                    anticipatePin: 1,
                    onUpdate: (self) => {
                        const progress = self.progress;
                        
                        // Логика появления текста
                        if (progress > 0.1 && progress < 0.4) {
                            title.innerText = "Ледокол";
                            subtitle.innerText = "Вид снаружи";
                            title.style.opacity = 1;
                            subtitle.style.opacity = 1;
                        } else if (progress >= 0.4 && progress < 0.8) {
                            title.innerText = "Смена ракурса";
                            subtitle.innerText = "Мы поднимаемся на борт...";
                            title.style.opacity = 0.8;
                            subtitle.style.opacity = 0.6;
                        } else if (progress >= 0.8) {
                            title.innerText = "На палубе";
                            subtitle.innerText = "Вид на льды";
                            title.style.opacity = 1;
                            subtitle.style.opacity = 1;
                        } else {
                            title.style.opacity = 0;
                            subtitle.style.opacity = 0;
                        }
                    }
                }
            });

            // Цикл отрисовки (чтобы не было черных полос)
            function render() {
                if (video.readyState >= 2) {
                    if (video.currentTime !== lastTime) {
                        drawVideoFrame();
                        lastTime = video.currentTime;
                    }
                }
                requestAnimationFrame(render);
            }
            render();
        });

        // Обработка ошибки загрузки
        video.addEventListener('error', () => {
            console.error("Ошибка загрузки видео. Проверьте путь 'img/vid 1.mp4'.");
            canvas.style.background = "linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbb2d)";
            title.innerText = "Видео не найдено";
            subtitle.innerText = "Проверьте путь к файлу";
        });
    </script>
</body>
</html>
