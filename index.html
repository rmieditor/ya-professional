<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная шапка (Scroll Video)</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
            color: #fff;
        }

        /* 
         * Контейнер, который задает длину прокрутки.
         * 400vh означает, что анимация будет длиться 4 экрана вниз.
         * Увеличьте это значение, если хотите, чтобы анимация была медленнее.
         */
        .scroll-track {
            height: 400vh; 
            position: relative;
        }

        /* 
         * "Залипающий" блок.
         * Он остается на экране, пока мы прокручиваем .scroll-track
         */
        .sticky-viewport {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* Канвас, на котором будет отрисовываться видео */
        #video-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Аналог background-size: cover */
            display: block;
        }

        /* Текст поверх видео */
        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 1000px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .overlay-text h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .overlay-text p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 300;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        /* Скрываем видео, оно нам нужно только как источник кадров */
        #source-video {
            display: none;
        }

        /* Секция, которая идет после анимации */
        .next-section {
            min-height: 100vh;
            padding: 100px 20px;
            background: #fff;
            color: #333;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .next-section h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- 1. Блок управления прокруткой -->
    <div class="scroll-track">
        <!-- 2. Визуальный блок, который "залипает" -->
        <div class="sticky-viewport">
            <!-- Канвас для отрисовки -->
            <canvas id="video-canvas"></canvas>
            
            <!-- Текстовый слой -->
            <div class="overlay-text">
                <h1 id="main-title">Добро пожаловать</h1>
                <p id="sub-title">Прокрутите вниз, чтобы увидеть эффект</p>
            </div>
        </div>
    </div>

    <!-- 3. Следующий контент на сайте -->
    <div class="next-section">
        <h2>Основной контент сайта</h2>
        <p>Шапка успешно развернулась. Теперь вы можете читать далее.</p>
    </div>

    <!-- Скрытое видео. Замените ссылку на свое видео (желательно MP4, H.264) -->
    <!-- crossOrigin="anonymous" нужен, чтобы избежать проблем с CORS при отрисовке на канвас -->
    <video id="source-video" 
           src="vid 1.mp4" 
           muted 
           playsinline 
           crossorigin="anonymous">
    </video>

    <!-- Подключаем GSAP и ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // Регистрируем плагин
        gsap.registerPlugin(ScrollTrigger);

        const video = document.getElementById('source-video');
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');
        const title = document.getElementById('main-title');
        const subtitle = document.getElementById('sub-title');

        // Функция для установки правильного размера канваса
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Перерисовываем текущий кадр при ресайзе
            if (video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Ждем, пока видео загрузит первые кадры
        video.addEventListener('loadeddata', () => {
            // Отрисовываем первый кадр
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Создаем анимацию GSAP
            gsap.to(video, {
                currentTime: video.duration, // Анимируем время видео от 0 до конца
                ease: "none", // Линейно, без ускорений
                scrollTrigger: {
                    trigger: ".scroll-track",
                    start: "top top", // Начинаем, когда верхний край блока совпадает с верхом экрана
                    end: "bottom bottom", // Заканчиваем, когда нижний край блока совпадает с низом экрана
                    scrub: 0.5, // Привязываем к скроллу. 0.5 - это плавность (сглаживание)
                    pin: true, // Закрепляем viewport
                    anticipatePin: 1,
                    onUpdate: (self) => {
                        // Логика смены текста в зависимости от прогресса прокрутки
                        const progress = self.progress;
                        
                        if (progress > 0.1 && progress < 0.4) {
                            title.innerText = "Ледокол";
                            subtitle.innerText = "Вид снаружи";
                            title.style.opacity = 1;
                            subtitle.style.opacity = 1;
                        } else if (progress >= 0.4 && progress < 0.8) {
                            title.innerText = "Смена ракурса";
                            subtitle.innerText = "Мы поднимаемся на борт...";
                            title.style.opacity = 0.8;
                            subtitle.style.opacity = 0.6;
                        } else if (progress >= 0.8) {
                            title.innerText = "На палубе";
                            subtitle.innerText = "Вид на льды";
                            title.style.opacity = 1;
                            subtitle.style.opacity = 1;
                        } else {
                            title.style.opacity = 0; // Прячем текст в самом начале
                            subtitle.style.opacity = 0;
                        }
                    }
                }
            });

            // Запускаем цикл отрисовки кадров (requestAnimationFrame)
            // Это нужно, потому что видео может не успевать отрисовываться само
            function render() {
                if (video.readyState >= 2) {
                    // Очищаем канвас
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    // Рисуем текущий кадр видео, растягивая его на весь экран
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }
                requestAnimationFrame(render);
            }
            render();
        });

        // Обработка ошибки загрузки видео
        video.addEventListener('error', () => {
            console.error("Ошибка загрузки видео. Проверьте ссылку или CORS.");
            // Фолбэк: заливаем фон градиентом, если видео не загрузилось
            canvas.style.background = "linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbb2d)";
            title.innerText = "Ошибка загрузки видео";
        });
    </script>
</body>
</html>
